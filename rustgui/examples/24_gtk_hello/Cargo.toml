[package]
name = "gtk_hello"
version = "0.1.0"
edition = "2024"

[dependencies]
# gtk4 0.11.5（crates.io 最新）：package 重命名成 gtk 是官方书/官方例程的
# 惯用写法（cargo add gtk4 --rename gtk 的等价手写）。
# 本地 G:\github\rust\gtk4-rs 是 master 0.12.0-alpha（未发布），一切 API
# 以本钉版为准，可用 `git -C G:\github\rust\gtk4-rs show 0.11.5:<path>` 对照。
gtk = { package = "gtk4", version = "0.11.5" }
