[package]
name = "slint_app"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18"
i-slint-backend-testing = { version = "1.18", default-features = false, features = ["ffi"] }
i-slint-core = { version = "1.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.18"
